[project]
name = "portfolio-backend"
version = "1.0.0"
description = "Django Portfolio Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-debug-toolbar>=4.0",
    "djangorestframework>=3.14",
    "djoser>=2.2",
    "djangorestframework-simplejwt>=5.3",
    "pillow>=10.0",
    "django-cors-headers>=4.3",
    "psycopg2-binary>=2.9",
    "drf-yasg>=1.21",
    "django-templated-mail>=1.1",
    "gunicorn>=21.0",
    "whitenoise>=6.6",
    "dj-database-url>=2.1",
    "cloudinary>=1.36",
    "django-cloudinary-storage>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-watch>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-watch>=4.2",
]
